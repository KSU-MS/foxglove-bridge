[package]
name = "foxglove-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4.44"
dbc-rs = "0.5.0"
flatbuffers = "25.12.19"
flatbuffers-build = "0.2.4"
flatbuffers-reflection = "0.1.0"
foxglove = "0.25.0"
futures-util = "0.3.32"
h264_webcam_stream = { git = "https://github.com/ChanceCtrl/h264_webcam_stream", version = "0.1.0" }
tokio = "1.52.3"

[dependencies.socketcan]
version = "3.5.0"
features = ["tokio"]

[dependencies.clap]
version = "4.6.1"
features = ["derive"]

[build-dependencies]
flatbuffers-build = "0.2.4"
